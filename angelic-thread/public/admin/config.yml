backend:
  name: git-gateway
  branch: main

# Add this line to allow local file editing:
# local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "products"
    label: "Boutique Products"
    folder: "src/data/products"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Price", name: "price", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Dresses", "Tops", "Kurtis", "Festive"]
      - { label: "Product Image", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text", required: false }
